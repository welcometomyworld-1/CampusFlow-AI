<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Rainbow Particle Trail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0f1123 0%, #05060b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .ui-overlay {
      position: absolute;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      transition: opacity 0.5s ease;
      z-index: 10;
    }

    .ui-overlay h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(90deg, #ff5e62, #ff9966, #ffea00, #38ef7d, #00f2fe, #4facfe, #b06ab3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
    }

    .ui-overlay p {
      font-size: 0.85rem;
      opacity: 0.6;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="ui-overlay" id="hint">
    <h1>Glowing Rainbow Trail</h1>
    <p>Move your cursor or touch & drag across the screen</p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const hint = document.getElementById("hint");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Mouse coordinates and interpolation
    const mouse = {
      x: width / 2,
      y: height / 2,
      prevX: width / 2,
      prevY: height / 2,
    };

    let globalHue = 0;
    const particles = [];

    // Particle class
    class Particle {
      constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        this.hue = hue;
        
        // Random velocity & angle for natural dispersion
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2.5 + 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.size = Math.random() * 2.8 + 1.8;     // Delicate radius
        this.initialSize = this.size;
        this.decay = Math.random() * 0.03 + 0.02;  // Shrinks faster
        this.life = 1;                             // 1.0 -> 0.0
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        
        // Gentle friction
        this.vx *= 0.96;
        this.vy *= 0.96;

        this.life -= this.decay;
        this.size = Math.max(0, this.initialSize * this.life);
      }

      draw() {
        ctx.save();
        
        // Soft Rainbow HSL color
        const alpha = Math.max(0, this.life * 0.45);
        const color = `hsla(${this.hue}, 80%, 60%, ${alpha})`;
        
        // Subtle soft glow effect
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsla(${this.hue}, 80%, 55%, ${alpha * 0.7})`;
        
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        // Soft center core
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Spawn particles with linear interpolation so fast mouse movement leaves no gaps
    function spawnParticles(currentX, currentY, prevX, prevY) {
      const dx = currentX - prevX;
      const dy = currentY - prevY;
      const distance = Math.hypot(dx, dy);
      
      // Interpolate points between previous and current cursor location
      const steps = Math.max(Math.floor(distance / 4), 1);

      for (let i = 0; i < steps; i++) {
        const factor = i / steps;
        const x = prevX + dx * factor;
        const y = prevY + dy * factor;
        
        // Cycle hue smoothly
        globalHue = (globalHue + 0.8) % 360;
        
        // Add particle with slight jitter
        particles.push(new Particle(
          x + (Math.random() - 0.5) * 6,
          y + (Math.random() - 0.5) * 6,
          globalHue
        ));
      }
    }

    // Input Event Handlers
    function updatePosition(x, y) {
      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
      mouse.x = x;
      mouse.y = y;
      
      spawnParticles(mouse.x, mouse.y, mouse.prevX, mouse.prevY);
      
      if (hint && hint.style.opacity !== "0") {
        hint.style.opacity = "0";
      }
    }

    window.addEventListener("mousemove", (e) => {
      updatePosition(e.clientX, e.clientY);
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        updatePosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        mouse.prevX = mouse.x;
        mouse.prevY = mouse.y;
      }
    }, { passive: true });

    // Idle animation: subtle spiral orbit when user is not moving
    let idleAngle = 0;
    let idleTimer = 0;

    function handleIdle() {
      idleTimer++;
      if (idleTimer > 90) { // After ~1.5s of no mouse movement
        idleAngle += 0.05;
        const orbitRadius = 80;
        const targetX = width / 2 + Math.cos(idleAngle) * orbitRadius;
        const targetY = height / 2 + Math.sin(idleAngle * 0.8) * (orbitRadius * 0.6);

        mouse.prevX = mouse.x;
        mouse.prevY = mouse.y;
        mouse.x += (targetX - mouse.x) * 0.08;
        mouse.y += (targetY - mouse.y) * 0.08;

        spawnParticles(mouse.x, mouse.y, mouse.prevX, mouse.prevY);
      }
    }

    window.addEventListener("mousemove", () => { idleTimer = 0; });
    window.addEventListener("touchstart", () => { idleTimer = 0; });

    // Main animation loop
    function animate() {
      // Clear with slight dark fade for trailing phosphor effect
      ctx.fillStyle = "rgba(5, 6, 11, 0.22)";
      ctx.fillRect(0, 0, width, height);

      // 'lighter' composite mode creates vibrant additive glowing overlaps
      ctx.globalCompositeOperation = "lighter";

      handleIdle();

      // Update and render active particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      // Reset composite operation for next frame clear
      ctx.globalCompositeOperation = "source-over";

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
